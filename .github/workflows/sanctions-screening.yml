name: Sanctions screening

# Downloads the current Consolidated Canadian Autonomous Sanctions List, screens
# it with src/sanctions_screening.py, and commits the aggregate result and the
# README block it writes. The list itself names real people and is never
# committed or uploaded: it lives in data/raw/ (gitignored) for the length of
# this job. Monthly, because the list changes; on demand for a fresh run.
on:
  schedule:
    - cron: "37 14 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanctions-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.sanctions_screening --download --evaluate --write-readme
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/sanctions_screening.json README.md
          if git diff --cached --quiet; then echo "result unchanged"; exit 0; fi
          day=$(python -c "import json; print(json.load(open('results/sanctions_screening.json'))['retrieved_at'][:10])")
          git commit -q -m "Sanctions screening: list retrieved ${day}, screened and re-evaluated"
          git pull --rebase -q origin main
          git push origin HEAD:main
