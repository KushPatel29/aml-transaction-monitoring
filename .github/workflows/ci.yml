name: CI

on:
  # Weekly, so a green badge means the tests pass now rather
  # than that they passed the day of the last push.
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    name: Pipeline and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The whole point of C4: one command has to rebuild everything.
      - name: Run the pipeline end to end
        run: python run_pipeline.py

      # gzip mtime is pinned, so a re-run of the generator must reproduce the
      # committed data byte for byte. If this step shows a diff in
      # data/generated/, the pipeline is not reproducible and the committed
      # artefacts no longer describe what the code produces.
      - name: Assert the generated data is reproducible
        run: |
          git diff --exit-code --stat -- data/generated/ \
            || (echo "::error::regenerating produced different data" && exit 1)

      - name: Run the test suite
        run: pytest -q

      # The README badge is a claim about this suite, and nothing used to
      # compare the two. healthcare's badge sat at 182 while its suite had
      # grown to 345 -- the number was counting test functions, not collected
      # cases, and no check could see the difference. This fails the build if
      # the badge and the suite ever disagree again.
      - name: The README test badge must match what the suite collects
        run: |
          collected=$(python -m pytest --collect-only -q 2>/dev/null             | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          claimed=$(grep -oE 'badge/tests-[0-9%C,]+%20passing' README.md | head -1             | sed -E 's|badge/tests-||; s|%20passing||; s|%2C||g; s|,||g')
          echo "suite collects: ${collected:-<none>}   README badge: ${claimed:-<none>}"
          if [ -z "$collected" ] || [ -z "$claimed" ]; then
            echo "::error::could not read one of the two numbers"; exit 1
          fi
          if [ "$collected" != "$claimed" ]; then
            echo "::error::README badge says $claimed, suite collects $collected"; exit 1
          fi
      - name: Run the slow reproducibility tests
        run: pytest -q -m slow

      - name: Render README figures
        run: python docs/make_figures.py

      # The app must import and build its frames without Streamlit running --
      # a broken dashboard should fail here, not on Community Cloud.
      - name: Smoke-test the dashboard
        run: |
          python - <<'PY'
          import pandas as pd
          import config as cfg
          from app import streamlit_app as app

          scored = pd.read_csv(cfg.SCORED_PATH, keep_default_na=False)
          entities = pd.read_csv(cfg.ENTITIES_PATH, keep_default_na=False)
          queue = app.build_case_queue(scored, entities, threshold=39.6)
          assert not queue.empty, "case queue is empty at the operating threshold"

          entity_id = queue["entity_id"].iloc[0]
          assert not app.build_entity_timeline(scored, entity_id).empty
          assert not app.build_feature_profile(scored, entity_id).empty
          app.build_counterparty_network(scored, entity_id)
          app.baseline_comparison_frame(scored, 39.6)
          print(f"dashboard OK: {len(queue)} entities in the queue")
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.15.21
      - run: ruff check .
